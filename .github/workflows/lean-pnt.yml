name: Lean PNT audit

on:
  push:
    paths:
      - 'navier-stokes/lean/**'
      - 'navier-stokes/src/**'
      - '.github/workflows/lean-pnt.yml'
  pull_request:
    paths:
      - 'navier-stokes/lean/**'
      - 'navier-stokes/src/**'
      - '.github/workflows/lean-pnt.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.elan
            ~/.cache/mathlib
            navier-stokes/lean/.lake
          key: ${{ runner.os }}-math19-${{ hashFiles('navier-stokes/lean/lean-toolchain', 'navier-stokes/lean/lake-manifest.json', 'navier-stokes/lean/lakefile.toml') }}
      - name: Install elan
        shell: bash
        run: |
          if [[ ! -x "$HOME/.elan/bin/elan" ]]; then
            curl --fail --silent --show-error --location --retry 3 \
              https://raw.githubusercontent.com/leanprover/elan/e9268f8b213e09a99768befe548049c046074225/elan-init.sh \
              -o "$RUNNER_TEMP/elan-init.sh"
            sh "$RUNNER_TEMP/elan-init.sh" -y --no-modify-path --default-toolchain none
          fi
      - name: Check proofs, rejected claims, and existing C++ objective
        run: ./navier-stokes/lean/verify.sh
